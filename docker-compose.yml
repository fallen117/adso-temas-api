services:
  api:
    build: ./temas-api
    container_name: adso-api
    env_file: ./temas-api/.env
    ports:
      - "3000:3000"
    # "no" = arranque estrictamente manual. Nada se levanta solo: ni al
    # reiniciar Windows, ni al abrir Docker Desktop. Tu workflow es encender
    # los contenedores cuando los necesitas y apagarlos cuando no.
    # (Con "unless-stopped", Docker Desktop los restauraria al arrancar solo
    # tras un reinicio de Windows, porque la politica solo respeta las paradas
    # que hagas TU, no las del daemon.)
    restart: "no"

  web:
    build: ./temas-angular
    container_name: adso-web
    ports:
      - "4200:4200"
    depends_on:
      - api
    restart: "no"

networks:
  default:
    name: adso-net
